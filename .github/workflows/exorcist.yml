name: exorcist

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: check + prove (Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exorcist (build, check deployed contracts, prove)
        uses: ./
        with:
          models: incident-2026-10-fixed deposit-fixed noreturn-fixed withdraw-fixed
          depth: "10"
          prove: "true"
      - name: WRITE-A-MODEL walkthrough (end to end)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          scripts/test-walkthrough.sh
      - name: Draft pipeline (offline, mock API)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          scripts/test-draft.sh
      - name: Agent gate (MCP server) test
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 mcp/agent_gate_demo.py
      - name: Self-test — the vulnerable examples must still be caught
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          for m in incident-2026-10 deposit-vulnerable noreturn-vulnerable withdraw-vulnerable; do
            set +e; ./.lake/build/bin/exorcist check "$m" --depth 10 > "out-$m.txt"; code=$?; set -e
            tail -3 "out-$m.txt"
            test "$code" -eq 1 || { echo "::error::$m: expected a violation"; exit 1; }
          done

  sandbox:
    name: sandbox replay (near-workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandbox/target
          key: sandbox-${{ runner.os }}-${{ hashFiles('sandbox/Cargo.lock') }}
      - name: Install elan
        run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Export traces, build wasm, replay in the sandbox
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          make sandbox
