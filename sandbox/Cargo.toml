[package]
name = "exorcist-sandbox"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["contracts/token", "contracts/vault", "contracts/hook"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-workspaces = { version = "0.24.0", default-features = false, features = ["install"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
