<svg xmlns="http://www.w3.org/2000/svg" width="980" height="485" viewBox="0 0 980 485" role="img" aria-label="Exorcist demo: finds the attack, proves the fix, make demo summary"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre}@keyframes s0{0%{opacity:0}0.000%{opacity:0}0.166%{opacity:1}99.834%{opacity:1}100.000%{opacity:0}100%{opacity:0}}@keyframes l0_0{0%{opacity:0}9.934%{opacity:0}10.099%{opacity:1}100%{opacity:1}}@keyframes l0_1{0%{opacity:0}11.424%{opacity:0}11.589%{opacity:1}100%{opacity:1}}@keyframes l0_2{0%{opacity:0}12.914%{opacity:0}13.079%{opacity:1}100%{opacity:1}}@keyframes l0_3{0%{opacity:0}14.404%{opacity:0}14.570%{opacity:1}100%{opacity:1}}@keyframes l0_4{0%{opacity:0}15.894%{opacity:0}16.060%{opacity:1}100%{opacity:1}}@keyframes l0_5{0%{opacity:0}17.384%{opacity:0}17.550%{opacity:1}100%{opacity:1}}@keyframes l0_6{0%{opacity:0}18.874%{opacity:0}19.040%{opacity:1}100%{opacity:1}}@keyframes l0_7{0%{opacity:0}20.364%{opacity:0}20.530%{opacity:1}100%{opacity:1}}@keyframes l0_8{0%{opacity:0}21.854%{opacity:0}22.020%{opacity:1}100%{opacity:1}}@keyframes l0_9{0%{opacity:0}23.344%{opacity:0}23.510%{opacity:1}100%{opacity:1}}@keyframes l0_10{0%{opacity:0}24.834%{opacity:0}25.000%{opacity:1}100%{opacity:1}}@keyframes l0_11{0%{opacity:0}26.325%{opacity:0}26.490%{opacity:1}100%{opacity:1}}@keyframes l0_12{0%{opacity:0}27.815%{opacity:0}27.980%{opacity:1}100%{opacity:1}}@keyframes l0_13{0%{opacity:0}29.305%{opacity:0}29.470%{opacity:1}100%{opacity:1}}@keyframes l0_14{0%{opacity:0}30.795%{opacity:0}30.960%{opacity:1}100%{opacity:1}}@keyframes l0_15{0%{opacity:0}32.285%{opacity:0}32.450%{opacity:1}100%{opacity:1}}@keyframes l0_16{0%{opacity:0}33.775%{opacity:0}33.940%{opacity:1}100%{opacity:1}}</style><rect width="980" height="485" rx="8" fill="#1e2127"/><circle cx="18" cy="16" r="5" fill="#e06c75"/><circle cx="36" cy="16" r="5" fill="#e5c07b"/><circle cx="54" cy="16" r="5" fill="#98c379"/><text x="490" y="20" fill="#7f8c98" text-anchor="middle">Exorcist MCP gate: the agent is blocked, then allowed after the fix</text><g style="animation:s0 6.04s linear infinite;opacity:0"><text x="16" y="56.5" fill="#e5c07b">$ python3 mcp/agent_gate_demo.py   # an AI agent must pass the Exorcist MCP gate to deploy</text><text x="16" y="73.0" fill="#d7dae0" style="animation:l0_0 6.04s linear infinite;opacity:0">connected to exorcist; tools: exorcist_check, exorcist_prove, exorcist_list</text><text x="16" y="89.5" fill="#d7dae0" style="animation:l0_1 6.04s linear infinite;opacity:0">agent&gt; before deploying, call exorcist_check(model=&#x27;withdraw-vulnerable&#x27;)</text><text x="16" y="106.0" fill="#e06c75" style="animation:l0_2 6.04s linear infinite;opacity:0">gate&gt;  verdict=violation  deploy_allowed=False  (3622 states)</text><text x="16" y="122.5" fill="#d7dae0" style="animation:l0_3 6.04s linear infinite;opacity:0">gate&gt;  attack found at depth 5 (funds_stuck); do not deploy</text><text x="16" y="139.0" fill="#d7dae0" style="animation:l0_4 6.04s linear infinite;opacity:0">         1. submit vault.withdraw  </text><text x="16" y="155.5" fill="#d7dae0" style="animation:l0_5 6.04s linear infinite;opacity:0">         2. run    vault.withdraw  ok</text><text x="16" y="172.0" fill="#d7dae0" style="animation:l0_6 6.04s linear infinite;opacity:0">         3. fail   token.ft_transfer  failed</text><text x="16" y="188.5" fill="#d7dae0" style="animation:l0_7 6.04s linear infinite;opacity:0">         4. run    vault.after_withdraw  ok</text><text x="16" y="205.0" fill="#d7dae0" style="animation:l0_8 6.04s linear infinite;opacity:0">         5. refund (1 yoctoNEAR deposit back to vault)</text><text x="16" y="221.5" fill="#d7dae0" style="animation:l0_9 6.04s linear infinite;opacity:0">gate&gt;  final state: {&quot;alice&quot;: 0, &quot;eve&quot;: 100, &quot;vault&quot;: 100, &quot;hook&quot;: 0} ledger={&quot;alice&quot;: 0, &quot;eve&quot;: 0}</text><text x="16" y="238.0" fill="#e06c75" style="animation:l0_10 6.04s linear infinite;opacity:0">agent&gt; DEPLOY BLOCKED. Fixing: restore the ledger in after_withdraw when ft_transfer failed.</text><text x="16" y="254.5" fill="#d7dae0" style="animation:l0_11 6.04s linear infinite;opacity:0">agent&gt; before deploying, call exorcist_check(model=&#x27;withdraw-fixed&#x27;)</text><text x="16" y="271.0" fill="#98c379" style="animation:l0_12 6.04s linear infinite;opacity:0">gate&gt;  verdict=no_violation_bounded_to_depth_10  deploy_allowed=True  (11154645 states)</text><text x="16" y="287.5" fill="#d7dae0" style="animation:l0_13 6.04s linear infinite;opacity:0">agent&gt; bounded check passed; call exorcist_prove(model=&#x27;withdraw-fixed&#x27;)</text><text x="16" y="304.0" fill="#98c379" style="animation:l0_14 6.04s linear infinite;opacity:0">gate&gt;  verdict=proven_all_traces  deploy_allowed=True  theorems=[&#x27;withdraw_fixed_solvent_all_traces&#x27;, &#x27;withdraw_fixed_no_stuck_all_traces&#x27;]</text><text x="16" y="320.5" fill="#98c379" style="animation:l0_15 6.04s linear infinite;opacity:0">agent&gt; gate passed: deploying withdraw-fixed (simulated; nothing is sent to any network)</text><text x="16" y="337.0" fill="#98c379" style="animation:l0_16 6.04s linear infinite;opacity:0">PASS: vulnerable contract blocked, fixed contract allowed</text></g></svg>