ity:1}100%{opacity:1}}@keyframes l2_16{0%{opacity:0}73.224%{opacity:0}73.279%{opacity:1}100%{opacity:1}}@keyframes l2_17{0%{opacity:0}73.716%{opacity:0}73.770%{opacity:1}100%{opacity:1}}@keyframes l2_18{0%{opacity:0}74.208%{opacity:0}74.262%{opacity:1}100%{opacity:1}}@keyframes l2_19{0%{opacity:0}74.699%{opacity:0}74.754%{opacity:1}100%{opacity:1}}@keyframes l2_20{0%{opacity:0}75.191%{opacity:0}75.246%{opacity:1}100%{opacity:1}}@keyframes l2_21{0%{opacity:0}75.683%{opacity:0}75.738%{opacity:1}100%{opacity:1}}@keyframes l2_22{0%{opacity:0}76.175%{opacity:0}76.230%{opacity:1}100%{opacity:1}}@keyframes l2_23{0%{opacity:0}76.667%{opacity:0}76.721%{opacity:1}100%{opacity:1}}@keyframes l2_24{0%{opacity:0}77.158%{opacity:0}77.213%{opacity:1}100%{opacity:1}}@keyframes l2_25{0%{opacity:0}77.650%{opacity:0}77.705%{opacity:1}100%{opacity:1}}@keyframes l2_26{0%{opacity:0}78.142%{opacity:0}78.197%{opacity:1}100%{opacity:1}}</style><rect width="980" height="551" rx="8" fill="#1e2127"/><circle cx="18" cy="16" r="5" fill="#e06c75"/><circle cx="36" cy="16" r="5" fill="#e5c07b"/><circle cx="54" cy="16" r="5" fill="#98c379"/><text x="490" y="20" fill="#7f8c98" text-anchor="middle">exorcist — finds ghost funds in NEAR contracts, or proves there are none</text><g style="animation:s0 18.30s linear infinite;opacity:0"><text x="16" y="56.5" fill="#e5c07b">$ exorcist check incident-2026-10</text><text x="16" y="73.0" fill="#7f8c98" style="animation:l0_0 18.30s linear infinite;opacity:0">NOTE:       a minimal model of the mechanism in the NEAR Intents postmortem (Oct 2026), written from scratch — NOT their contract</text><text x="16" y="89.5" fill="#e06c75" style="animation:l0_1 18.30s linear infinite;opacity:0">RESULT: VIOLATION (insolvent) at depth 8, 26191 states explored in 43 ms. Shortest attack trace:</text><text x="16" y="106.0" fill="#d7dae0" style="animation:l0_2 18.30s linear infinite;opacity:0">1. eve sends tx: token.ft_transfer_call(vault, 100, &quot;notify hook&quot;) (+1 yocto)</text><text x="16" y="122.5" fill="#d7dae0" style="animation:l0_3 18.30s linear infinite;opacity:0">     ledger: alice=300 eve=0 (total 300) | tokens: vault=300 alice=0 eve=100</text><text x="16" y="139.0" fill="#d7dae0" style="animation:l0_4 18.30s linear infinite;opacity:0">2. run #0 token.ft_transfer_call(vault, 100, &quot;notify hook&quot;)  ⇒ returns a promise</text><text x="16" y="155.5" fill="#d7dae0" style="animation:l0_5 18.30s linear infinite;opacity:0">     ledger: alice=300 eve=0 (total 300) | tokens: vault=400 alice=0 eve=0</text><text x="16" y="172.0" fill="#d7dae0" style="animation:l0_6 18.30s linear infinite;opacity:0">3. run #1 vault.ft_on_transfer(eve, 100, &quot;notify hook&quot;)  ⇒ returns a promise</text><text x="16" y="188.5" fill="#d7dae0" style="animation:l0_7 18.30s linear infinite;opacity:0">     ledger: alice=300 eve=100 (total 400) | tokens: vault=400 alice=0 eve=0</text><text x="16" y="205.0" fill="#e06c75" style="animation:l0_8 18.30s linear infinite;opacity:0">4. FAIL #3 hook.on_deposit(eve, 100)  ⇒ adversary makes it fail</text><text x="16" y="221.5" fill="#d7dae0" style="animation:l0_9 18.30s linear infinite;opacity:0">     ledger: alice=300 eve=100 (total 400) | tokens: vault=400 alice=0 eve=0</text><text x="16" y="238.0" fill="#d7dae0" style="animation:l0_10 18.30s linear infinite;opacity:0">5. run #2 token.ft_resolve_transfer(eve, vault, 100)  ⇒ ok, returns 0  — refunds 100 vault → eve</text><text x="16" y="254.5" fill="#e06c75" style="animation:l0_11 18.30s linear infinite;opacity:0">     ledger: alice=300 eve=100 (total 400) | tokens: vault=300 alice=0 eve=100   ⚠ INSOLVENT (ledger &gt; tokens held)</text><text x="16" y="271.0" fill="#d7dae0" style="animation:l0_12 18.30s linear infinite;opacity:0">6. eve sends tx: vault.withdraw(100)</text><text x="16" y="287.5" fill="#e06c75" style="animation:l0_13 18.30s linear infinite;opacity:0">     ledger: alice=300 eve=100 (total 400) | tokens: vault=300 alice=0 eve=100   ⚠ INSOLVENT (ledger &gt; tokens held)</text><text x="16" y="304.0" fill="#d7dae0" style="animation:l0_14 18.30s linear infinite;opacity:0">7. run #5 vault.withdraw(100)  ⇒ ok (no value)</text><text x="16" y="320.5" fill="#d7dae0" style="animation:l0_15 18.30s linear infinite;opacity:0">     ledger: alice=300 eve=0 (total 300) | tokens: vault=300 alice=0 eve=100</text><text x="16" y="337.0" fill="#d7dae0" style="animation:l0_16 18.30s linear infinite;opacity:0">8. run #6 token.ft_transfer(eve, 100)  ⇒ ok (no value)</text><text x="16" y="353.5" fill="#e06c75" style="animation:l0_17 18.30s linear infinite;opacity:0">     ledger: alice=300 eve=0 (total 300) | tokens: vault=200 alice=0 eve=200   ⚠ INSOLVENT (ledger &gt; tokens held)</text><text x="16" y="370.0" fill="#d7dae0" style="animation:l0_18 18.30s linear infinite;opacity:0"></text><text x="16" y="386.5" fill="#98c379" style="animation:l0_19 18.30s linear infinite;opacity:0">  ✓ checked by the Lean kernel (decide): this trace really violates the property</text></g><g style="animation:s1 18.30s linear infinite;opacity:0"><text x="16" y="56.5" fill="#e5c07b">$ exorcist prove incident-2026-10-fixed</text><text x="16" y="73.0" fill="#7f8c98" style="animation:l1_0 18.30s linear infinite;opacity:0">NOTE:      a minimal model of the mechanism in the NEAR Intents postmortem (Oct 2026), written from scratch — NOT their contract</text><text x="16" y="89.5" fill="#d7dae0" style="animation:l1_1 18.30s linear infinite;opacity:0">statement: for EVERY trace from init (any length, any interleaving, ANY receipt may fail),</text><text x="16" y="106.0" fill="#d7dae0" style="animation:l1_2 18.30s linear infinite;opacity:0">           transactions from any non-contract account: Σ ledger ≤ tokens held by the vault</text><text x="16" y="122.5" fill="#98c379" style="animation:l1_3 18.30s linear infinite;opacity:0">RESULT:    ✓ PROVEN FOR ALL TRACES: solvent (checked by the Lean kernel now, file out/prove-incident-2026-10-fixed.lean)</text><text x="16" y="139.0" fill="#7f8c98" style="animation:l1_4 18.30s linear infinite;opacity:0">axioms:    &#x27;incident_2026_10_fixed_solvent_all_traces&#x27; depends on axioms: [propext, Classical.choice, Quot.sound]</text><text x="16" y="155.5" fill="#7f8c98" style="animation:l1_5 18.30s linear infinite;opacity:0">axioms:    &#x27;NearAsync.Vault.Proof.fixed_vault_solvent_forever&#x27; depends on axioms: [propext, Classical.choice, Quot.sound]</text></g><g style="animation:s2 18.30s linear infinite;opacity:0"><text x="16" y="56.5" fill="#e5c07b">$ make demo</text><text x="16" y="73.0" fill="#d7dae0" style="animation:l2_0 18.30s linear infinite;opacity:0">        result                                                                    label</text><text x="16" y="89.5" fill="#98c379" style="animation:l2_1 18.30s linear infinite;opacity:0">PASS    lake build: semantics, models, witness + liveness theorems, unbounded proof  kernel-checked</text><text x="16" y="106.0" fill="#98c379" style="animation:l2_2 18.30s linear infinite;opacity:0">PASS    incident-2026-10: attack found, witness theorem kernel-checked            found at depth 8 (26191 states)</text><text x="16" y="122.5" fill="#98c379" style="animation:l2_3 18.30s linear infinite;opacity:0">PASS    deposit-vulnerable: attack found, witness theorem kernel-checked          found at depth 5 (444 states)</text><text x="16" y="139.0" fill="#98c379" style="animation:l2_4 18.30s linear infinite;opacity:0">PASS    noreturn-vulnerable: attack found, witness theorem kernel-checked         found at depth 5 (438 states)</text><text x="16" y="155.5" fill="#98c379" style="animation:l2_5 18.30s linear infinite;opacity:0">PASS    withdraw-vulnerable: attack found, witness theorem kernel-checked         found at depth 5 (3622 states)</text><text x="16" y="172.0" fill="#98c379" style="animation:l2_6 18.30s linear infinite;opacity:0">PASS    incident-2026-10-fixed: no violation, honest deposit + withdraw reachable  bounded to depth 10</text><text x="16" y="188.5" fill="#98c379" style="animation:l2_7 18.30s linear infinite;opacity:0">PASS    deposit-fixed: no violation, honest deposit + withdraw reachable          bounded to depth 10</text><text x="16" y="205.0" fill="#98c379" style="animation:l2_8 18.30s linear infinite;opacity:0">PASS    noreturn-fixed: no violation, honest deposit + withdraw reachable         bounded to depth 10</text><text x="16" y="221.5" fill="#98c379" style="animation:l2_9 18.30s linear infinite;opacity:0">PASS    withdraw-fixed: no violation, honest deposit + withdraw reachable         bounded to depth 10</text><text x="16" y="238.0" fill="#98c379" style="animation:l2_10 18.30s linear infinite;opacity:0">PASS    incident-2026-10-fixed: solvent (sum of ledger &lt;= tokens held)            proven for all traces</text><text x="16" y="254.5" fill="#98c379" style="animation:l2_11 18.30s linear infinite;opacity:0">PASS    deposit-fixed: solvent (sum of ledger &lt;= tokens held)                     proven for all traces</text><text x="16" y="271.0" fill="#98c379" style="animation:l2_12 18.30s linear infinite;opacity:0">PASS    noreturn-fixed: solvent (sum of ledger &lt;= tokens held)                    proven for all traces</text><text x="16" y="287.5" fill="#98c379" style="animation:l2_13 18.30s linear infinite;opacity:0">PASS    withdraw-fixed: solvent (sum of ledger &lt;= tokens held)                    proven for all traces</text><text x="16" y="304.0" fill="#98c379" style="animation:l2_14 18.30s linear infinite;opacity:0">PASS    withdraw-fixed: no stuck funds (tokens held = ledger when idle)           proven for all traces</text><text x="16" y="320.5" fill="#98c379" style="animation:l2_15 18.30s linear infinite;opacity:0">PASS    noreturn-fixed: no stuck funds (tokens held = ledger when idle)           proven for all traces</text><text x="16" y="337.0" fill="#98c379" style="animation:l2_16 18.30s linear infinite;opacity:0">PASS    agent gate (MCP): vulnerable blocked, fixed allowed                       check + prove via MCP</text><text x="16" y="353.5" fill="#98c379" style="animation:l2_17 18.30s linear infinite;opacity:0">PASS    sandbox: deposit_attack_fails_on_fixed_vault                              matches model step by step</text><text x="16" y="370.0" fill="#98c379" style="animation:l2_18 18.30s linear infinite;opacity:0">PASS    sandbox: deposit_attack_on_vulnerable_vault                               matches model step by step</text><text x="16" y="386.5" fill="#98c379" style="animation:l2_19 18.30s linear infinite;opacity:0">PASS    sandbox: happy_path_fixed_vault_noreturn_hook                             matches model step by step</text><text x="16" y="403.0" fill="#98c379" style="animation:l2_20 18.30s linear infinite;opacity:0">PASS    sandbox: happy_path_fixed_vault                                           matches model step by step</text><text x="16" y="419.5" fill="#98c379" style="animation:l2_21 18.30s linear infinite;opacity:0">PASS    sandbox: noreturn_attack_fails_on_fixed_vault                             matches model step by step</text><text x="16" y="436.0" fill="#98c379" style="animation:l2_22 18.30s linear infinite;opacity:0">PASS    sandbox: harness_detects_model_mismatch                                   negative control: harness rejects a wrong prediction</text><text x="16" y="452.5" fill="#98c379" style="animation:l2_23 18.30s linear infinite;opacity:0">PASS    sandbox: noreturn_attack_on_vulnerable_vault                              matches model step by step</text><text x="16" y="469.0" fill="#98c379" style="animation:l2_24 18.30s linear infinite;opacity:0">PASS    sandbox: withdraw_restores_on_fixed_vault                                 matches model step by step</text><text x="16" y="485.5" fill="#98c379" style="animation:l2_25 18.30s linear infinite;opacity:0">PASS    sandbox: withdraw_without_restore_on_vulnerable_vault                     matches model step by step</text><text x="16" y="502.0" fill="#